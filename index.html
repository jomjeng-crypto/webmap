<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Offline Web GIS - 7 Provinces</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- MapLibre GL CSS -->
    <link href="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        .map-overlay {
            position: absolute; top: 10px; left: 10px; z-index: 1;
            background: white; padding: 12px; border-radius: 6px; box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        select { padding: 5px; font-size: 14px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="map-overlay">
        <h3 style="margin: 0 0 5px 0; font-size: 16px;">แผนที่ขอบเขต 7 จังหวัด</h3>
        <label style="font-size: 13px; color: #555;">เลือกมุมมองจังหวัด:</label><br>
        <select id="province-select">
            <option value="all">แสดงทั้งหมด 7 จังหวัด</option>
            <option value="Buri Ram">บุรีรัมย์</option>
            <option value="Chanthaburi">จันทบุรี</option>
            <option value="Sa Kaeo">สระแก้ว</option>
            <option value="Si Sa Ket">ศรีสะเกษ</option>
            <option value="Surin">สุรินทร์</option>
            <option value="Trat">ตราด</option>
            <option value="Ubon">อุบลราชธานี</option>
        </select>
    </div>

    <div id="map"></div>

    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.js"></script>
    <script>
        const map = new maplibregl.Map({
            container: document.getElementById('map'),
            style: {
                version: 8,
                sources: {},
                layers: [{ id: 'background', type: 'background', paint: { 'background-color': '#f1f5f9' } }]
            },
            center: [103.5, 14.2],
            zoom: 7
        });

        map.on('load', () => {
            map.addSource('provinces-source', {
                type: 'geojson',
                data: './data/provinces.geojson'
            });

            map.addLayer({
                id: 'provinces-fill',
                type: 'fill',
                source: 'provinces-source',
                paint: {
                    'fill-color': '#3b82f6',
                    'fill-opacity': 0.25
                }
            });

            map.addLayer({
                id: 'provinces-line',
                type: 'line',
                source: 'provinces-source',
                paint: {
                    'line-color': '#1e3a8a',
                    'line-width': 1.5
                }
            });

            map.on('click', 'provinces-fill', (e) => {
                const props = e.features[0].properties;
                const provName = props.PROV_NAME || props.amp_name || 'ไม่ระบุชื่อ';

                new maplibregl.Popup()
                    .setLngLat(e.lngLat)
                    .setHTML(`<b>จังหวัด:</b> ${provName}`)
                    .addTo(map);
            });

            map.on('mouseenter', 'provinces-fill', () => { map.getCanvas().style.cursor = 'pointer'; });
            map.on('mouseleave', 'provinces-fill', () => { map.getCanvas().style.cursor = ''; });
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Registered!', reg))
                    .catch(err => console.log('Service Worker Failed:', err));
            });
        }
    </script>
</body>
</html>
